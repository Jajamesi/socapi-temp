[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "socapi"
version = "0.1.15"
description = "Python async package to wotk with poll constructor"
authors = [
  { name="ZhironkinAA", email="ZhironkinAA@anodialog.ru" },
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.5",
    "beautifulsoup4>=4.15.0",
    "html-for-docx>=1.2.0",
    "orjson==3.12.0",
    "pydantic[email]==2.13.5",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "python-docx>=1.2.0",
    "python-dotenv==1.2.3",
]


[tool.setuptools]
package-dir = {"" = "src"}

[project.urls]
Homepage = "https://gitlab.dialog.info/sociology/packages/socapi"

[tool.pytest.ini_options]
asyncio_mode = "auto"
