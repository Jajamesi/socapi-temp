[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "socapi"
version = "0.1.12"
description = "Python async package to wotk with poll constructor"
authors = [
  { name="ZhironkinAA", email="ZhironkinAA@anodialog.ru" },
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.5",
    "beautifulsoup4>=4.15.0",
    "orjson>=3.11.9",
    "pydantic[email]>=2.13.4",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "python-dotenv>=1.2.2",
]


[tool.setuptools]
package-dir = {"" = "src"}

[project.urls]
Homepage = "https://gitlab.dialog.info/sociology/packages/socapi"

[tool.pytest.ini_options]
asyncio_mode = "auto"
